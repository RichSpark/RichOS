name: packaging-ci

# THE SIGNING SCRIPTS HAD NO GATE, AND SIGNING IS THE ONE THING THAT IS WRONG FOR
# WEEKS BEFORE ANYBODY FINDS OUT.
#
# `richos/app/scripts/package-app.sh` decides how RichOS is signed, whether it is
# notarized, and whether the CEO's microphone permission survives the next build.
# Until this file existed, the only thing that ever ran it was a person deciding to
# cut a release — which is the last possible moment to discover that a refusal
# stopped refusing. The three workflows beside this one cover the Rust spine, the
# browser suites and the engine; between them there was nothing pointed at the
# release path.
#
# WHAT IT ACTUALLY RUNS. `richos/app/scripts/run-tests.sh`, which discovers every
# `*.test.sh` in that directory from disk. The step list is deliberately not spelled
# out here: two places naming the same set is the typed-inventory defect in YAML,
# and this repository has now paid for that five times.
#
# WHY macos-latest. The suites drive `codesign`, `security`, `stapler` and the TCC
# databases. There is no Linux answer to any of them — an ubuntu job would be cheap,
# green and about a different question. The runner itself refuses on a non-Darwin
# host rather than skipping, so a misconfigured runner cannot report a pass.
#
# WHAT THIS RUN CANNOT COVER, stated rather than glossed. GitHub's macOS runners
# have no Developer ID certificate and this repository has no secret holding one,
# so nothing here signs with a real identity, notarizes, or staples. The suites say
# the same thing in their own headers and mark the shimmed cases `[shim]`. What
# this gate protects is every refusal, the identity-discovery rule, the notary
# credential rules, and every branch of the bundle verification — fired against a
# real ad-hoc signature made by the runner's own codesign.
#
# =========================================================================================
# IT WAS DORMANT FOR NINE DAYS AND FOR TWO SEPARATE REASONS, WHICH IS WHY NOBODY NOTICED
# =========================================================================================
#
# Its last run of any kind was `33459952385` on 2026-09-01, and the seven before it were
# red too. A workflow can be stopped in two independent places and this one was stopped in
# both, so fixing either alone would have changed nothing:
#
#   1. THE FILE. All `push` and `pull_request` triggers were removed on 2026-09-04
#      (`2ba051b7`), leaving `workflow_dispatch` alone.
#   2. THE REPOSITORY SETTING. It was `disabled_manually` at the Actions API — one of the
#      five switched off on 2026-09-01 over a billing block. Going public made Actions free
#      and the other four were switched back on; this one was not. Measured 2026-09-10:
#
#        gh api repos/RichSpark/RichOS/actions/workflows \
#          --jq '.workflows[] | "\(.state)\t\(.name)"'
#        -> disabled_manually  packaging-ci      (every other workflow: active)
#
#      AND THAT SILENTLY VOIDED THIS FILE'S OWN ESCAPE HATCH. The header used to say
#      `workflow_dispatch` was kept "so the gate can be demanded on a named SHA the day the
#      blocker clears". It could not be:
#
#        gh workflow run packaging-ci.yml --ref main
#        -> HTTP 422: Cannot trigger a 'workflow_dispatch' on a disabled workflow
#
#      A disabled workflow refuses a dispatch as well. The documented way to demand this
#      gate had not worked since the day it was written down, and nothing said so.
#
# The setting was set back to `active` on 2026-09-10. A workflow's state is not in git, so
# it cannot be reviewed and it cannot be diffed — which is exactly how this one stayed off
# through a re-enable pass that its own README describes. If it is ever switched off again,
# the reason belongs in this header on the same day.
#
# =========================================================================================
# WHAT WAS ACTUALLY WRONG, MEASURED ON THE RUNNER RATHER THAN REASONED ABOUT
# =========================================================================================
#
# Run `34444955517`, 2026-09-10, `main` at `8bec9050`, dispatched with no changes: 8 suites
# discovered, 4 red, 2m46s. Full transcript in `docs/verification/packaging-ci-2026-09-10/`.
# Every one of the four had a different cause and none of them was the product being broken:
#
#   updater-setup.test.sh   the runner image ships no `cargo-tauri`, so `cargo tauri signer
#                           generate` could not make a key. FIXED HERE by installing a
#                           pinned CLI below — a runner-environment defect, not a code one.
#
#   package-app.test.sh B2  the same missing CLI: `package-app.sh` exited 3 on it before it
#                           could reach the refusal the case is about. Same fix.
#
#   make-release.test.sh    R6-R9 red — the RIGHT exit code from the WRONG refusal. `cmd_app`
#                           runs the named-person gate first and that gate refuses when the
#                           operator's private deny-list is absent, which it is on every
#                           machine but one. A defect in the SUITE, fixed in the suite: it
#                           now puts the gate into a known state and asserts its precedence
#                           on purpose, as case R5a, instead of tripping over it in red.
#
#   gui-boot.test.sh        exit 2 — "a fact about THIS MACHINE, not a verdict about the
#                           code". See below. This one is not fixable from any file here.
#
# =========================================================================================
# THE ONE GAP THAT IS DECLARED RATHER THAN FIXED, AND THE MACHINERY THAT KEEPS IT HONEST
# =========================================================================================
#
# `gui-boot.test.sh` boots the shipped binary under launchd's environment. To do that it
# builds a machine, and the machine needs the loro compiler — `bin/loro-context.mjs` and
# `bin/loro-write.mjs`, which are not tracked in this repository at all. They live in the
# private record repository, 37 files of it. No public runner can ever hold them, and no
# amount of work in this file changes that.
#
# Until 2026-09-10 that single structural gap was the reason ALL EIGHT suites were switched
# off: `run-tests.sh` had no notion of a host that cannot answer, so it called that suite
# failed, and a red cross that always means nothing was correctly judged worse than none.
# The cost was that seven suites which pass perfectly on a runner — the whole release path —
# went ungated for nine days to protect the reporting of the eighth.
#
# `run-tests.sh` now understands the exit code that suite has always used, and the
# allowance is deliberately hard to abuse. A gap counts only if it is DECLARED BY NAME WITH
# A REASON, an undeclared gap is red, a declaration whose suite answered is red, a suite
# that ran and lost still outranks everything, and the summary can no longer say "all N
# suites passed" while a gap exists. `run-tests.test.sh` executes all seven of those claims
# against a copy of the harness on every run of this workflow, and the four that are new go
# red against the harness as it stood before them.
#
# So the declaration below is not a way of asking for less. It is the one input to that
# machinery, in one place, where a reviewer reads it — and the day the compiler becomes
# reachable from a public checkout, DELETING this line is not optional: a declaration whose
# suite has started answering turns the build red until it is removed.
#
# ---------------------------------------------------------------------------
# THE DECLARATIONS `ci-status.sh` READS
# ---------------------------------------------------------------------------
# Absent until 2026-09-15, which is why this workflow read UNDECLARED on the
# slow and hollow axes. Both numbers below are measured, not chosen.
#
# WALL CLOCK on main, over the 15 completed runs the API returns
# (`gh api 'repos/RichSpark/RichOS/actions/workflows/packaging-ci.yml/runs?branch=main&per_page=30'`):
# the seven GREEN runs span 252 s to 690 s, median 448 s. The failing runs are
# faster, not slower — they fail early — so the ceiling is set off the green
# side, which is the only side that describes a healthy run. 15m is the 690 s
# worst green plus 30%: enough for a slow macOS runner, tight enough that a
# suite growing from eleven minutes to twenty is disagreed with.
# ci-budget: 15m
#
# WHAT MAKES ITS GREEN LOAD-BEARING. `richos/app/scripts/run-tests.sh` discovers every
# `*.test.sh` beside it FROM DISK — there is no list in this YAML to fall out of
# step — refuses an empty inventory with exit 2 rather than reporting "all 0
# suites passed", and prints the corpus it judged. Its closing line on run
# 34772213352, quoted rather than described:
#
#   === richos/app/scripts: 8 of 9 suites passed — 149 checks — 1 could not run on this host: gui-boot.test.sh ===
#
# The one gap is NAMED because the harness refuses to hide it: an undeclared
# gap is red, and a declaration whose suite has started answering is ALSO red,
# so the allowance cannot outlive the host limitation that earned it. A suite
# that printed `FAIL <case>` is counted failed no matter what any declaration
# says. That is a green somebody can read the size of.
# ci-evidence: richos/app/scripts/run-tests.sh discovers every *.test.sh beside it from disk (no list in this YAML to drift), refuses an empty inventory with exit 2 rather than "all 0 suites passed", and prints the corpus it judged — run 34772213352 closed with "8 of 9 suites passed — 149 checks — 1 could not run on this host: gui-boot.test.sh", where an undeclared gap is red AND a declaration whose suite has started answering is red, so the green states its own size and its own hole
# ---------------------------------------------------------------------------

on:
  # THE TRIGGERS ARE BACK, AND THE PATH LIST IS THE ONE TYPED THING IN THIS FILE.
  # A path filter is YAML and there is nowhere to derive it from — `ui-suite-ci.yml` says
  # the same about its own. So it errs WIDE: all of `richos/app/`, because these suites read the
  # scripts, the manifests, the plists, the capabilities and the frontend exclusion list,
  # and a miss here costs a run that should have happened. The engine entries are narrow
  # and named: `make-release.sh` derives the asset name from `richos/engine/VERSION` and runs
  # `named-persons.sh` as the release's last gate before any artifact exists.
  push:
    paths:
      - "richos/app/**"
      - "richos/engine/VERSION"
      - "richos/engine/voice/**"
      - "richos/engine/scripts/named-persons.sh"
      - "richos/engine/scripts/lib/named-persons.sh"
      - "richos/engine/scripts/lib/named-persons.py"
      - "LICENSE"
      - ".github/workflows/packaging-ci.yml"
  pull_request:
    paths:
      - "richos/app/**"
      - "richos/engine/VERSION"
      - "richos/engine/voice/**"
      - "richos/engine/scripts/named-persons.sh"
      - "richos/engine/scripts/lib/named-persons.sh"
      - "richos/engine/scripts/lib/named-persons.py"
      - "LICENSE"
      - ".github/workflows/packaging-ci.yml"
  # So the gate can still be demanded on a named SHA. It could not be while the workflow
  # was disabled at the API, which is recorded above rather than left to be rediscovered.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: macos-latest
    # The measured pass is minutes, not tens of minutes, but `updater-setup.test.sh` builds
    # two `src-tauri` examples with `cargo run --example`, and the FIRST run on a cold
    # runner pays for that from scratch. The limit is a real limit rather than a shrug:
    # a run that takes half an hour has stopped being the fast gate this is meant to be,
    # and the number in the log is what the next person should tighten it against.
    timeout-minutes: 30
    env:
      # THE ONLY DECLARED HOST GAP. See the header. `run-tests.sh` refuses a bare name, so
      # the reason is not decoration — and it refuses this line altogether on the day the
      # suite starts answering here.
      # `>-` folds this into ONE line, because a declaration is one line: `<suite>: <reason>`.
      RUN_TESTS_DECLARED_GAPS: >-
        gui-boot.test.sh: the boot fixture copies the loro compiler (bin/loro-context.mjs,
        bin/loro-write.mjs), which is not tracked in this repository — it lives in the private
        record repository. A public runner cannot have it, so there is no machine to boot on
        and no verdict to reach. Measured on this runner, 2026-09-10, run 34444955517.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: what this runner has
        run: |
          sw_vers
          uname -m
          cargo --version
          security find-identity -v -p codesigning || true
          echo "^ zero Developer ID identities is expected here and is why the"
          echo "  signing cases run against a shim. See this workflow's header."

      # THE RUNNER IMAGE SHIPS RUST AND NO TAURI CLI, and two suites need `cargo tauri`.
      #
      # NOT `cargo install tauri-cli`: that compiles a large crate from source on every run
      # for a binary upstream already publishes, and "whatever ^2 resolves to today" is a
      # third-party default deciding what this gate tests. The version is pinned to 2.11.4 —
      # the one every document in this repository describes and reasons about — and the
      # archive is pinned by SHA-256, so a moved release asset is a refusal rather than a
      # silent substitution. Both digests were taken from the published assets on 2026-09-10.
      #
      # The architecture is READ, not assumed. `macos-latest` is arm64 today and was x86_64
      # not long ago; an unknown machine is refused rather than guessed at, because the wrong
      # binary would fail later and somewhere less obvious.
      - name: Tauri CLI 2.11.4, pinned by version and by digest
        run: bash richos/app/scripts/install-tauri-cli.sh

      - name: richos/app/scripts suites
        run: bash richos/app/scripts/run-tests.sh
