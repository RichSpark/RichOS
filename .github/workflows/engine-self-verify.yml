name: engine-self-verify

# --- CI-SURFACE DECLARATIONS -----------------------------------------------
# Read by richos/engine/scripts/lib/ci-surface.py, which judges every workflow on six
# axes and treats a missing declaration as a finding.
#
# THE SKIP LINE BELOW IS THE POINT OF THIS BLOCK. On 2026-09-10 the founder's
# screen showed "1 failing, 17 successful, and 1 skipped" and asked about it.
# The skipped one is `affected`, it is skipped CORRECTLY, and the reason was
# already written down — in this file, at the section headed "affected — THE
# REQUIRED CHECK", and in the `if:` at the job itself. NOTHING READ EITHER OF
# THOSE. Prose in a header is not an answer to a question on a screen; a
# declaration a tool reads and prints back is. An undeclared skip is now a
# finding, and this is the line that stops this one being one.
#
# WALL CLOCK, re-measured 2026-09-15. The 2026-09-10 reading below this one was
# honest and it was taken before the workspace-spec suites entered the
# inventory, so it described a pass that no longer exists:
#
#   2026-09-10, last 30 runs: min 64s, median 719s, p90 5683s, max 8178s. The
#   p90 and max were all FAILING runs; the most recent green (#100) was 961s,
#   and 40m was set off the green side deliberately — a budget sized to
#   accommodate the worst failure never fires.
#
# 2026-09-15, run #216 end to end (`gh api .../runs/34945072758/jobs`): 63m47s,
# GREEN shards apart from one real assertion failure. The old 40m ceiling was
# therefore breached on every full run and had stopped carrying information.
#
# The new number is the FLOOR plus what runs around it, not a round figure:
#
#   2811.7 s   scripts/workspace-spec-fourteen.test.sh — the largest
#              INDIVISIBLE unit, so no shard count goes below it
#    ~180 s    checkout, python, git identity, receipt upload
#    ~120 s    the coverage job's download and verify
#   -------
#    ~52 min   expected wall clock for a full green pass
#
# 60m is that plus 15% headroom. It is above the floor and BELOW the 75-minute
# job ceiling, so a breach of this budget is still a finding rather than a
# cancellation. It comes DOWN when that suite is sectioned; it is not a target
# to grow into.
# ci-budget: 60m
# ci-skip: affected — the fast per-diff gate. When `shards` runs (main, dispatch, schedule) the whole inventory is verified, the affected set is a subset of it by construction, and `affected-coverage` proves that union rather than asserting it. Its skip on those runs means the STRONGER check ran, and this workflow is red if that stronger check did not.
# ci-evidence: the shard plan and the affected set are both DERIVED from the engine at run time (scripts/ci-units.sh, scripts/ci-affected-units.sh), never typed here, and `coverage` fails unless the receipts from every shard union to exactly the declared inventory — so a green cannot mean "the units it happened to know about passed"
# ---------------------------------------------------------------------------

# THIS IS THE COPY THAT ACTUALLY RUNS.
#
# GitHub Actions discovers workflows ONLY in a `.github/workflows/` directory
# at the REPOSITORY ROOT. Until 2026-08-29 this repository's only copy lived at
# `richos/engine/.github/workflows/engine-self-verify.yml` — correct as a template for
# an adopter who copies the engine's contents to THEIR root, and completely
# inert here. It had never executed once: `gh run list` returned nothing at all.
# Not broken. Unreachable. That is the same defect the engine's own test runner
# exists to end, one level out: a correct rule with nothing enforcing it.
#
# WHAT IT VERIFIES is deliberately NOT written down here. Both this file and the
# adopter template call `richos/engine/scripts/ci-verify.sh` and `ci-shard.sh`, which
# are the only places the steps and the unit inventory are written — because two
# YAML files each spelling out the same seven steps is a typed inventory in a
# different costume, and this engine does not keep those.
#
# THE ENGINE LIVES IN A SUBDIRECTORY HERE (`richos/engine/`), because this repository
# also carries the product that loads it by reference. Hence
# `working-directory: engine`. An adopter who vendored the engine at their root
# drops that line; the template under `richos/engine/.github/` already has it dropped.
#
# WHAT THIS RUN CANNOT COVER, stated rather than skipped: the integrity probe's
# BY-REFERENCE layer set (BR1-BR10). Those layers verify that an operator's
# user-scope `~/.claude` plugin registration resolves to this engine — a
# property of a workstation, not of a repository, and there is no honest way to
# synthesize it on a runner. They are exercised instead by
# `scripts/hooks/by-reference.test.sh`, which builds that two-root topology from
# scratch and which the unit inventory discovers automatically. See
# `richos/engine/docs/ci-portability-notes.md`.
#
# =========================================================================================
# 2026-09-10 — THE TRIGGERS ARE BACK, AND WHAT HAD TO EXIST FIRST
# =========================================================================================
#
# `push:` and `pull_request:` were deleted from this file on 2026-09-01 and the workflow was
# disabled at GitHub the same morning. The workflow object itself has been `active` since
# 2026-09-06T19:36:26+01:00 (verified with `gh workflow list --all`, id 345224407); only the
# triggers were still missing, so the gate could be demanded by hand and could not fire on
# its own. The full history of how that happened, who switched what off and what was measured
# at each step, is kept in `richos/engine/docs/ci-sharding.md` rather than here, because this file
# had grown to 200 lines of history above 30 lines of workflow.
#
# THE REASON THE TRIGGERS COULD NOT SIMPLY GO BACK was never that they would not work. It was
# that this job was a SINGLE 123-MINUTE JOB with four red suites in it, so turning it on would
# have put a cross on every commit, from day one, over defects that predate the flip — and a
# cross that always means nothing teaches everyone to ignore the one that will someday matter.
#
# So three things exist now that did not before, and the triggers come back on top of them:
#
#   1. A FAST REQUIRED GATE THAT MATCHES THE ACTUAL PROBLEM. 101 of the 120 suites were
#      created in the twelve days to 2026-09-09, about eight a day, none of them ever run on
#      Linux before landing. Fixing a red list buys one green run; the inflow breaks it again
#      the same week. The `affected` job below runs the suites THIS DIFF can affect, in
#      minutes, on every push — so a suite gets its first Linux execution on the day it lands,
#      by the person who wrote it. `affected-coverage` is the job to mark required — it is the
#      one that both waits for every affected shard AND proves they covered exactly the set the
#      diff selected, and it is the only one of the two that still reports on a docs-only diff
#      where `affected` is correctly skipped.
#
#   2. THE FULL PASS, SHARDED, WITH ITS COVERAGE PROVEN. 123 minutes serial becomes ~16
#      across twelve shards, and the arithmetic is in `richos/engine/scripts/ci-units.sh`. Splitting
#      a pass introduces a failure the serial runner never had — a shard that runs FEWER units
#      than it was given still exits 0 — so every unit writes a receipt and the `coverage` job
#      refuses unless the receipts union to the whole inventory, at ONE commit, with no unit
#      unaccounted for.
#
#   3. A CHECK FOR RUNS THAT NEVER HAPPENED. GitHub Free allows 20 concurrent jobs
#      ACCOUNT-WIDE, shared here with six other active workflows, and an exceeded limit DROPS
#      runs rather than queueing them. A dropped run leaves no record at all, so every tool
#      that reads "the latest run" reports the previous commit's verdict instead. That is
#      `engine-run-record.yml`, on a schedule, and it is the reason the matrix below declares
#      `max-parallel` rather than asking for all twelve at once.
#
# TWO SUITES WERE RED ON MAIN, WERE DECLARED RATHER THAN SKIPPED, AND WERE FIXED BY THEIR OWNER
# THE SAME DAY. They were red identically on macOS and on Linux, so neither was a portability
# finding, and both were proven by execution to be contract regressions:
# `shell-worktree-sparse.test.sh` passed 21/21 at `6472bb60^` and failed 6 at `4f01e5c7`;
# `terminalize-agent-worktrees.test.sh` passed 42/42 at `2afb9703^` and failed 11. Neither commit
# updated the suite it invalidated. They went into `richos/engine/scripts/lib/ci-known-red.tsv` with the
# commit, the failing cases and a 14-day expiry; `zach-opus-cr2` re-specified both and landed at
# `b4945c11`; and the rows were then deleted NOT because anybody remembered them but because that
# table's own negative control failed the run over them — a declared unit that PASSES is a row
# that is now a lie. Twelve days of tolerance granted, fourteen hours used. The table is empty
# and its rules are kept. See `richos/engine/docs/ci-sharding.md`.

on:
  # Back on 2026-09-10. Every push and every pull request gets the fast
  # `affected` gate; only main, a dispatch or the schedule pays for the full
  # sharded pass, because twelve shards on every branch push would be this
  # workflow starving the other six of the account's 20 concurrent jobs.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "full (every unit, sharded) or affected (only what the diff touches)"
        required: false
        default: full
        type: choice
        options: [full, affected]
  schedule:
    # 04:17 UTC daily. The full pass on main, on a day nobody pushed, is the
    # only thing that catches a suite broken by the passage of time — an
    # expiring known-red entry, a dated fixture, a certificate.
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  # One run per ref. A superseded push's run is stopped rather than left to
  # compete for the account's concurrency with the run that replaced it —
  # which matters here because losing that competition means being DROPPED,
  # not queued. main is never auto-stopped: its record is what
  # engine-run-record.yml checks.
  group: engine-self-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # plan — the shard matrix and the affected unit list, both DERIVED
  # ---------------------------------------------------------------------------
  # The shard count is declared once, in richos/engine/scripts/ci-units.sh, and read
  # here. It is deliberately not a number typed into this YAML: a matrix length
  # that disagrees with the planner is a set of units nothing runs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      shards: ${{ steps.derive.outputs.shards }}
      affected: ${{ steps.affected.outputs.units }}
      affected_count: ${{ steps.affected.outputs.count }}
      affected_matrix: ${{ steps.affected.outputs.affected_matrix }}
      run_full: ${{ steps.derive.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Derive the shard plan from the engine, never from this file
        id: derive
        working-directory: richos/engine
        run: |
          SHARDS="$(scripts/ci-units.sh shard-count)"
          MATRIX="$(scripts/ci-units.sh matrix "$SHARDS")"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.ref }}" = "refs/heads/main" ] \
             || [ "${{ github.event.inputs.scope }}" = "full" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi
          echo "--- the plan this run will execute ---"
          scripts/ci-units.sh plan "$SHARDS" | tail -20

      - name: Which units can this diff affect
        id: affected
        working-directory: richos/engine
        run: |
          # Skipped when the full pass is running: the mapping walks every suite
          # for every changed path, which is not free, and nothing consumes the
          # answer. The output is still SET (to zero) rather than left undefined,
          # because a job condition reading an undefined output is a job that
          # silently does not run.
          if [ "${{ steps.derive.outputs.run_full }}" = "true" ]; then
            echo "full pass on this ref — the diff-scoped mapping is not computed"
            # One block, one redirect. Three separate `>>` to the same file was
            # the only actionlint finding left in any workflow of any governed
            # repository (SC2129), and leaving one is how a lint run stops being
            # something anyone reads to completion.
            {
              echo "count=0"
              echo "affected_matrix=[]"
              echo "units<<AFFECTED_EOF"
              echo "AFFECTED_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The base to diff against, by event. A first push to a new branch
          # reports an all-zero `before`, and a pull request's base is its own
          # field; neither is guessed, and if none resolves the fallback is the
          # merge-base with main rather than an empty diff — an empty diff would
          # select nothing and the gate would certify the push against nothing.
          BASE=""
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
          esac
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              BASE="$(git merge-base origin/main HEAD 2>/dev/null || true)" ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::no usable diff base resolved; the affected gate will run the WHOLE inventory"
            scripts/ci-units.sh units | cut -f1 > /tmp/affected.txt
          else
            echo "diff base: $BASE"
            scripts/ci-affected-units.sh --range "$BASE..HEAD" --explain > /tmp/affected.txt
          fi
          COUNT="$(grep -c . /tmp/affected.txt || true)"
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "units<<AFFECTED_EOF"
            cat /tmp/affected.txt
            echo "AFFECTED_EOF"
          } >> "$GITHUB_OUTPUT"
          # THE AFFECTED SET IS SHARDED TOO, and this work's own first push is
          # why. It selected 54 units costing ~100 minutes serial — a change to
          # contract-integrity-probe.sh is named in the sectioned suite's
          # preamble, so it selects all 24 sections, and pulls in
          # reconcile-terminal-worktrees.test.sh at 940 s besides. As ONE job it
          # was killed at the 60-minute timeout, and a required check that dies
          # on a large diff is a required check people learn to ignore.
          #
          # Same planner, restricted to the diff's units. The matrix carries only
          # shards that HAVE units, so a two-unit diff is two small jobs and not
          # twelve, ten of which would have nothing to run.
          if [ "${COUNT:-0}" -gt 0 ]; then
            AMATRIX="$(scripts/ci-units.sh matrix "$SHARDS" --units-file /tmp/affected.txt)"
            echo "--- the affected plan ---"
            scripts/ci-units.sh plan "$SHARDS" --units-file /tmp/affected.txt | tail -4
          else
            AMATRIX='[]'
          fi
          echo "affected_matrix=$AMATRIX" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # affected — THE REQUIRED CHECK. Fast, on every push and every pull request.
  # ---------------------------------------------------------------------------
  # WHAT IT COSTS IN THE WORST CASE, said rather than discovered: a change to
  # the shared fixture at the top of contract-integrity.test.sh maps to all 24
  # of its sections, about 40 minutes. That is correct — such a change really
  # does affect every section — and it is rare. A typical guard-plus-suite diff
  # is two to five minutes.
  affected:
    needs: plan
    # NOT WHEN THE FULL PASS IS RUNNING, and this is a concurrency decision with
    # a measurement behind it. On a dispatch on 2026-09-10 (run 34425677957)
    # this workflow asked for 26 jobs at once — twelve affected shards, twelve
    # full shards, and two more — and GitHub put the run into `queued` waiting
    # for slots. The account-wide ceiling is 20 across every workflow, and an
    # exceeded limit DROPS runs rather than queueing them, which is the very
    # failure engine-run-record.yml exists to catch. Declaring `max-parallel: 6`
    # and then asking for two matrices at once was arguing with myself.
    #
    # The affected set is a SUBSET of the full inventory by construction, so
    # when `shards` is running there is nothing the affected jobs could prove
    # that `coverage` does not prove better. `affected-coverage` says so rather
    # than going quiet.
    if: needs.plan.outputs.run_full != 'true' && needs.plan.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    # 60 rather than 150: the longest shard of ANY set is bounded by the largest
    # indivisible unit, reconcile-terminal-worktrees.test.sh at 940 s on this
    # hardware. Re-promise it against the longest shard a real run reports, not
    # against a guess.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.affected_matrix) }}
    defaults:
      run:
        working-directory: richos/engine
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Declare a git identity for the throwaway test fixtures
        run: |
          git config --global user.name  "engine-self-verify"
          git config --global user.email "engine-self-verify@users.noreply.github.com"
      - name: Run shard ${{ matrix.shard }} of the units this diff can affect
        run: |
          printf '%s\n' '${{ needs.plan.outputs.affected }}' | grep -v '^$' > /tmp/affected.txt || true
          echo "$(grep -c . /tmp/affected.txt || echo 0) unit(s) selected by the diff; this job runs shard ${{ matrix.shard }}/${{ matrix.shards }} of them"
          scripts/ci-shard.sh --units-file /tmp/affected.txt \
                              --shard "${{ matrix.shard }}/${{ matrix.shards }}" \
                              --receipt "/tmp/receipts/affected-${{ matrix.shard }}.jsonl"
      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: receipt-affected-${{ matrix.shard }}
          path: /tmp/receipts/affected-${{ matrix.shard }}.jsonl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # affected-coverage — the same union proof, over the AFFECTED plan
  # ---------------------------------------------------------------------------
  # A diff-scoped gate has the same hole a sharded pass has, and the same fix:
  # its shards must be shown to have covered exactly the set the diff selected.
  # Checked against the RESTRICTED plan, never the whole inventory — that would
  # report 94 false absences and teach everyone to ignore this job.
  #
  # It also passes, deliberately, when the diff selected NOTHING: a docs-only
  # change legitimately has no units, `affected` is skipped, and this job says
  # so out loud rather than being silently absent.
  affected-coverage:
    needs: [plan, affected]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Collect the affected receipts
        if: needs.plan.outputs.affected_count != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: receipt-affected-*
          path: /tmp/receipts
          merge-multiple: true
      - name: The affected shards must cover exactly what the diff selected
        working-directory: richos/engine
        run: |
          if [ "${{ needs.plan.outputs.run_full }}" = "true" ]; then
            echo "The FULL pass is running on this ref, so the diff-scoped gate was skipped."
            echo "The affected set is a subset of the whole inventory by construction, so the"
            echo "coverage job proves everything this one could have. This job is NOT the proof"
            echo "on this ref, and says so rather than reporting a green it did not earn."
            exit 0
          fi
          if [ "${{ needs.plan.outputs.affected_count }}" = "0" ]; then
            echo "This diff selects no unit — a docs-only change, and the correct answer."
            echo "ci-affected-units.sh has already refused any changed EXECUTABLE that no suite names,"
            echo "so this emptiness is an answer rather than a silence."
            exit 0
          fi
          printf '%s\n' '${{ needs.plan.outputs.affected }}' | grep -v '^$' > /tmp/affected.txt
          scripts/ci-shard.sh --verify-receipts /tmp/receipts --units-file /tmp/affected.txt
          if [ "${{ needs.affected.result }}" != "success" ]; then
            echo "::error::the affected shards did not all succeed (${{ needs.affected.result }}) — the union above is complete, but at least one unit inside it is red"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # non-suite-steps — everything in ci-verify.sh EXCEPT the suites
  # ---------------------------------------------------------------------------
  non-suite-steps:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: richos/engine
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Historical negative controls in workspace-retire.test.sh exercise
          # the actual defective revisions. The default depth of 1 omits them.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Several suites build throwaway git repositories in $TMPDIR and commit
      # into them, inheriting the machine's ambient identity by design (see the
      # comment in scripts/lib/resolve-roots.test.sh). Every workstation has
      # one; a runner has none, and without it `git commit` exits 128 inside the
      # fixtures and the probe's Layer Q quietly downgrades to "FUNCTIONAL
      # CANARY DID NOT RUN". ci-verify.sh refuses to start without an identity
      # rather than degrade, so declare it here — visibly, and only on the
      # ephemeral runner.
      - name: Declare a git identity for the throwaway test fixtures
        run: |
          git config --global user.name  "engine-self-verify"
          git config --global user.email "engine-self-verify@users.noreply.github.com"
      - name: Verify the engine, minus the suites (scripts/ci-verify.sh --no-suites)
        run: scripts/ci-verify.sh --no-suites

  # ---------------------------------------------------------------------------
  # shards — step 3, in parallel. Only where the full pass is wanted.
  # ---------------------------------------------------------------------------
  shards:
    needs: plan
    if: needs.plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    # 75, and the arithmetic rather than a preference. The comment here used to
    # say the longest shard was bounded by reconcile-terminal-worktrees.test.sh
    # at 940 s, "so ~16 minutes is the expected wall clock and 60 is 3.7x it".
    # That was true when written and had been overtaken: measured on run #216
    # with `gh api repos/RichSpark/RichOS/actions/runs/34945072758/jobs`,
    # the longest shard took 3146 s — 52.4 minutes, 87% of the ceiling this
    # number was set to be 3.7x of.
    #
    # The floor is the largest INDIVISIBLE unit, which is now
    # scripts/workspace-spec-fourteen.test.sh at 2811.7 s (46.9 min). No shard
    # count can go below it. `ci-shard.sh` gives every unit a deadline capped at
    # 3600 s, and that deadline is only useful if it fires BEFORE this one — the
    # point of it is to NAME the stuck unit instead of losing the job
    # anonymously. So: 3600 s unit deadline < 4500 s job ceiling, with 15
    # minutes for the shard to report, write its receipt and upload it.
    #
    # This comes DOWN, not up, when that suite is sectioned. Re-promise it
    # against the measured longest shard, never against a guess.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Never all twelve at once. GitHub Free allows 20 concurrent jobs
      # ACCOUNT-WIDE across every workflow in the account, and an exceeded
      # limit DROPS runs rather than queueing them. Six leaves room for the
      # other workflows and costs one extra wave.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: richos/engine
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Declare a git identity for the throwaway test fixtures
        run: |
          git config --global user.name  "engine-self-verify"
          git config --global user.email "engine-self-verify@users.noreply.github.com"
      - name: Run shard ${{ matrix.shard }} of ${{ matrix.shards }}
        run: |
          scripts/ci-shard.sh --shard "${{ matrix.shard }}/${{ matrix.shards }}" \
                              --receipt "/tmp/receipts/shard-${{ matrix.shard }}.jsonl"
      - name: Upload the receipt
        # ALWAYS, including on failure: the coverage job's whole job is to see
        # what ran, and a shard that failed still ran units. A receipt uploaded
        # only on success would make a red shard indistinguishable from a
        # missing one.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: receipt-shard-${{ matrix.shard }}
          path: /tmp/receipts/shard-${{ matrix.shard }}.jsonl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # coverage — the proof that the shards covered the whole inventory
  # ---------------------------------------------------------------------------
  # `if: always()` and an explicit check of the shard results, because the
  # failure this job exists for is a shard that never reported. A coverage job
  # that only runs when every shard succeeded can never catch the case it is
  # for.
  coverage:
    needs: [plan, shards]
    if: always() && needs.plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Collect every shard receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: receipt-shard-*
          path: /tmp/receipts
          merge-multiple: true
      - name: The shards' union must equal the planned inventory
        working-directory: richos/engine
        run: |
          echo "shards job result: ${{ needs.shards.result }}"
          # --emit-weights is passed unconditionally. The finding it answers is
          # that the packing data went stale for days while the instruction for
          # re-measuring it was a sentence telling a person to go and do
          # arithmetic over twelve job logs. Now the run produces the finished
          # file and says which rows moved; committing it is the whole job.
          #
          # THE VERDICT IS CAPTURED AND RE-EMITTED, not left in a step log.
          # `✗ ci-receipts: this run does NOT certify d2664cdbf4` was printed on
          # run #216 and nobody was told — it went to stderr inside a collapsed
          # step of a job somebody would have had to open. A certification that
          # silently fails to certify is the same defect as a scanner reporting
          # clean over an empty corpus: the exit code was right and the sentence
          # that mattered was somewhere nobody reads.
          set +e
          scripts/ci-shard.sh --verify-receipts /tmp/receipts \
                              --emit-weights /tmp/ci-unit-weights.measured.tsv \
                              > /tmp/coverage.out 2>&1
          COVER_RC=$?
          set -e
          cat /tmp/coverage.out
          # ANNOTATIONS appear on the run's own summary page and against the
          # commit, which is where somebody deciding whether to land is already
          # looking. The step summary carries the same verdict for the same
          # reason. Braced rather than repeated `>>` — shellcheck SC2129, and
          # it keeps the block atomic.
          {
            echo "### engine-self-verify coverage"
            echo ""
            echo '```'
            cat /tmp/coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COVER_RC" -ne 0 ]; then
            echo "::error::THE RECEIPTS DO NOT CERTIFY THIS COMMIT. $(grep -m1 'does NOT certify' /tmp/coverage.out || echo 'see the coverage step for which units are missing, red, or at a different commit')"
            exit "$COVER_RC"
          fi
          echo "::notice::$(grep -m1 'planned unit(s) ran' /tmp/coverage.out || echo 'coverage verified')"
          # The receipts can only certify what they contain. A shards job that
          # did not itself succeed is reported separately, so a green coverage
          # line can never stand in for a red suite.
          if [ "${{ needs.shards.result }}" != "success" ]; then
            echo "::error::the shard jobs did not all succeed (${{ needs.shards.result }}) — the union above is complete, but at least one unit inside it is red"
            exit 1
          fi
      - name: Upload the measured weights
        # ALWAYS: a run whose shards went red still measured every unit that
        # ran, and a stale plan is most worth fixing on the days CI is already
        # unhappy. `if-no-files-found: warn` because a run that never reached
        # the verify step legitimately has nothing to upload, and turning that
        # into a second red would report the wrong defect.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-unit-weights-measured
          path: /tmp/ci-unit-weights.measured.tsv
          if-no-files-found: warn
