name: ui-suite-ci

# --- CI-SURFACE DECLARATIONS -----------------------------------------------
# Read by richos/engine/scripts/lib/ci-surface.py, which judges every workflow on six
# axes and treats a MISSING declaration as a finding rather than a pass.
#
# THE BUDGET IS ARGUED FROM THIS WORKFLOW'S OWN SHARDED RUNS, not from its
# history, and the distinction matters here more than anywhere else in this
# directory: the surface standard measured ui-suite-ci at p90 2182s, and that
# number is the SERIAL job this change replaces. Quoting it as the budget would
# pin a ceiling to behavior that no longer exists.
#
# Measured on the two green sharded runs, both on this branch:
#   34448209503  7 shards  902s   4 of 7 started at once, 3 queued
#   34449768368  5 shards  815s   3 of 5 started at once, 2 queued
#
# 25m is roughly 1.8x the slower of those. It is deliberately looser than twice
# the p90 of a settled workflow would be, and the reason is measured rather than
# cautious: the wall clock here is dominated by how many macOS runners the pool
# will start at once, which was 3 in one run and 4 in the other, and which this
# workflow does not control. A tighter ceiling would fire on the pool being busy,
# which is the fastest way to teach everyone to ignore it. It still catches the
# thing worth catching — a regression to the ~30m serial behavior trips it.
# The job's own timeout-minutes is 45.
# ci-budget: 25m
#
# AND THE BUDGET SAYS WHICH RUNS IT DESCRIBES, added 2026-09-15. Everything
# above was argued from the sharded design and it was right; what it could not
# say was that the runs it would be CHECKED against still included the serial
# job. So `ci-status.sh` reported "OVER BUDGET: run #76 took 40m33s against a
# declared ceiling of 25m" — true, and about a workflow that no longer exists.
# Measured with
# `gh api 'repos/RichSpark/RichOS/actions/workflows/ui-suite-ci.yml/runs?branch=main&per_page=30'`:
#
#   sharded   #87 488s  #86 748s  #85 597s  #84 706s  #83 872s  #82 613s
#   serial    #78 1880s #76 2433s #72 1673s #70 1978s #69 2035s #68 2054s
#
# Every sharded run is inside this ceiling with room; every serial run is over
# it. Raising the ceiling to 45m to silence the finding would have pinned the
# budget to behavior that was deliberately removed, and waiting for the window
# to roll would have left a standing finding nobody could act on — which is how
# a reader learns to skim past the one that matters.
# ci-budget-since: 82 — sharding landed; runs up to #78 are the serial job this design replaced, 1673-2433s against 488-872s for every sharded run since
# ci-evidence: the `coverage` job refuses unless the union of every shard's receipts EQUALS the suite inventory discovered from disk, all at ONE commit, none duplicated, each having run at least the checks its own source declares — so a green here names all 31 suites rather than counting green ticks
# ---------------------------------------------------------------------------

# THE BROWSER SUITES, AND NOTHING HAS EVER RUN THEM BUT A PERSON TYPING THE COMMAND.
#
# There were twelve when this file was written and twenty-one on 2026-09-04, which is why
# the number is no longer in this sentence: `run.js` discovers them from disk, so the count
# is a fact about the directory and writing it here makes a second copy that goes stale.
#
# `richos/app/ui/tests/` is the only coverage the CEO's actual screen has — the timeline renderer,
# the correction desk, the feedback channel's privacy guarantee, the affordance rule, the
# 10,000-item scale promise, and the shell that assembles them. `app-spine-ci.yml` next to
# this file covers the Rust spine and stops at the wire. `engine-self-verify.yml` covers the
# engine. Between them there was nothing at all pointed at the front end, so the suites ran
# when somebody remembered, which is the defect all three of these files exist to end.
#
# WHY macos-latest, WHICH IS TEN TIMES THE MINUTES. `lib/harness.js` rule 2: Tauri renders
# through WKWebView on macOS, and "a green Chromium run says nothing about what the CEO
# sees". That constraint survives being put on a runner. Playwright's LINUX `webkit` build is
# the WebKitGTK port — a different WebKit with a different graphics stack — so an
# ubuntu-latest job here would be cheap, green, and answering a question nobody asked. On
# macOS, Playwright ships a build of Apple's WebKit, the engine family WKWebView renders
# through. The bill is the price of the answer being about the right engine.
#
# THE SENTENCE HERE USED TO SAY "the suites take about four minutes", and by 2026-09-10 the
# real number was 1792 seconds — thirty minutes, stale by 7x. It is not restated as a new
# constant, because that is how it went wrong the first time: the wall clock is a fact about
# the packing and the runner, both of which move, so it is MEASURED at the bottom of this
# header against a run id, and `node run.js --plan=<N>` prints the current one from the
# committed weights on demand.
#
# WHY NOT FOLD IT INTO app-spine-ci.yml, which is already a job in this repository. Because
# that one is Rust on ubuntu and this one is Node on macOS: sharing a file would mean one of
# the two runs on the wrong machine, and a matrix over two jobs with nothing in common is
# ceremony. The same argument app-spine-ci.yml makes for not folding itself into the engine's
# runner applies one level in.
#
# HOW THIS CANNOT REPORT A GREEN RUN IT DID NOT EARN. Discovery-from-disk (already in
# `run.js`) fixes which suites are STARTED and says nothing about what they DID — and every
# failure of this kind in this repository exited 0 honestly: the scanner that reported CLEAN
# over an empty corpus really did run, and the `run.js` that reported "all 4 suites passed"
# really did pass the four it knew about. So `run.js` now also gates on evidence: every suite
# reports how many checks it ran, and a suite that reports none, or fewer than its own source
# declares (`run.check(` counted off disk, both sides derived, no number typed anywhere),
# fails the run whatever it exited. Zero total checks fails even if every process exited 0.
# The step below prints those counts, so the numbers are in the log rather than in a claim.
#
# WHAT IT DELIBERATELY DOES NOT COVER, named rather than skipped:
#   - NOTHING, since 2026-09-04. realbytes.js used to be named here and allowed to skip,
#     because nobody knew whether a fresh `macos-latest` image could afford the `cargo run
#     --example timeline_payload` behind it — the detached `richos/app/src-tauri` workspace with the
#     entire webview dependency tree, estimated at a 1.3 GB build and roughly a quarter of an
#     hour. The estimate was the reason for the allowance and it was never measured.
#
#     RUN 33872963879 MEASURED IT. The image carries cargo, the suite RAN, and the gate said
#     so in as many words: `NOTE  --allow-skip=realbytes.js was passed and was not needed:
#     realbytes.js ran here.` It took 2m16s of a 25m10s job against this file's 45-minute
#     budget — 9% of the run and 5% of the ceiling — and reported 7 checks, 7 declared, 0
#     failed. Timed off the log's own stamps: the suite before it reported at 12:43:04.737Z
#     and realbytes reported at 12:45:20.937Z.
#
#     So the allowance is gone from the command line below. It cost nothing to keep and it
#     was worth more than nothing to remove: while it stood, a runner image that dropped Rust
#     would have taken this suite out silently-by-permission, and the ONE suite that renders
#     the bytes the backend actually emits is the last one to lose quietly. Any skip by any
#     suite now fails the run, which is the state the rest of this directory has always been
#     in. The 45 minutes stay — they were sized for this build and it is still in the job.
#   - §23 Phase 6, "every acceptance state in the real shell". These suites drive WebKit
#     through Playwright, not through the Tauri shell, so Phase 6 is exactly as unproven
#     after this workflow as before it. Nothing here closes it and nothing here should be
#     read as closing it.
#   - Anything about the backend's own behavior. That is `cargo test -p richos-core`, in the
#     workflow next to this one.
#
# IT HAS NOW RUN, AND THE FIRST ONE WAS RED. Run 33872963879, on the SHA `richos` went public
# with, 2026-09-04: 21 suites, 407 checks, 25m10s. `scale.js` failed 1 of 12 and `splash.js`
# failed 8 of 25 — every one of them a check that measured the RUNNER and reported it as the
# product, and every one of them green on the machine the suites were written on. The
# diagnosis and the repairs are in the commits that carry this change; the short version is
# that splash.js timed the curtain from the moment `page.goto()` returned (~55 ms after the
# curtain here, ~2,000 ms there) and scale.js asserted an absolute frame budget with nothing
# to compare it against.
#
# That run also showed `home.js` failing two checks and exiting 0, which `run.js` printed as
# FAIL and counted as fine; both the suite and the gate are fixed.
#
# It still must not be described as "CI-verified" until a run of THIS workflow is GREEN on a
# SHA somebody can name — the same sentence app-spine-ci.yml and windows-companion-ci.yml each
# carry, for the same reason.
#
# THE SHA IS c220052b, RUN 34453797475, 2026-09-10, and this is the run this file's numbers
# are quoted against:
#
#   ✓ ui-suite: 31/31 discovered suite(s) ran, all green, all at c220052b3a9e…
#     554 checks observed. serial cost 1530 s across 5 shard(s).
#
#   shards (1) +0s 113s · (4) +0s 211s · (5) +0s 426s · (2) +2s 455s · (3) +4s 476s
#   coverage +489s 16s · WALL CLOCK 512 s (8.5 min) against the 1816 s serial job it replaces
#
# All five shards started within four seconds of each other, which is the uncontended case the
# five-wide matrix is sized for, and the longest came in at 476s against the packing's
# predicted 495s. Two earlier green runs on the same branch took 902s and 815s while the macOS
# pool was busy; that spread is the pool's, not the packing's, and it is why `ci-budget` above
# is 25m rather than something tight enough to look impressive.
#
# BEFORE THIS RUN THE WORKFLOW HAD BEEN RED FOR FOUR DAYS — every run since 2026-09-06T18:22Z
# (44 failures against 16 successes in the last 60), on three suites: affordances.js, which had
# a removed button's id typed into it in five places; contrast.js, whose absolute whole-page
# node floors tripped on an unrelated removal from the shell; and docs-claims.js, which was
# right, and caught richos/app/README.md claiming 196 richos-voice tests where the tree has 210.
#
# HOW LONG IT TAKES, MEASURED, AND WHY THE MATRIX IS FIVE WIDE. The arithmetic is written
# down where the decision was made, so whoever revisits it is not estimating.
#
# THE PARAGRAPH THAT STOOD HERE WAS THE 2026-09-05 VERSION OF THIS ONE, and it is worth saying
# why it is gone rather than amended: it listed 22 per-suite times and concluded "N=6 is the
# last N that buys anything". By 2026-09-10 there were 31 suites, the serial cost had gone from
# 20m34s to 1792s, and the last N that buys anything was 7. Every sentence in it was true when
# written. A table of durations is a measurement with a date on it, which is exactly what
# `richos/app/ui/tests/suite-weights.tsv` now is — one line per suite, re-derivable by command, rather
# than prose that has to be remembered.
#
# THE SERIAL BASELINE, run 34435558131 (2026-09-10, 31 suites): job 30m28s, of which the single
# suite step is 1792s and the whole rest of the job is 24s — checkout 7s, toolchain 1s, `npm ci`
# 9s with WebKit out of the image cache, nushell 5s, the WebKit probe 1s.
#
# THE PACKING, from `richos/app/ui/tests/suite-weights.tsv` — every weight a receipt from run
# 34448209503, the first green sharded pass, so they are ONE run's numbers and comparable with
# each other. Runner serial total 2155s; heaviest suite `splash.js` at 305s.
# `node run.js --plan=<N>` prints any of these:
#
#   N=4  longest shard 616s      N=6  longest shard 413s
#   N=5  longest shard 495s      N=7  longest shard 353s
#                                N=8  longest shard 310s  <- the floor, splash.js alone
#
# AND THE PACKING IS NOT WHAT DECIDES N. That was the mistake in the first version of this
# paragraph, which read a table like the one above, took the smallest longest-shard and set
# the matrix to seven. Run 34448209503 was green in 902s — a real 2x on the 1816s serial job,
# and nowhere near the ~400s the table predicts. Its own job timeline says why:
#
#   shards (3) start +  0s   shards (7) start +295s
#   shards (4) start +  1s   shards (5) start +439s
#   shards (2) start +  2s   shards (1) start +525s
#   shards (6) start +  2s
#
# FOUR STARTED; THREE QUEUED, each beginning only as an earlier one finished. GitHub-hosted
# macOS runners are a small shared pool, and at that moment it was also carrying a SECOND
# ui-suite-ci run — main moved twice while this one was in flight — plus packaging-ci. So a
# shard count above what the pool will actually start at once does not buy a shorter wall
# clock; it buys a second wave, and pays another job's setup for the privilege.
#
# FIVE IS THE NUMBER THE POOL WILL RUN AT ONCE. That is why the matrix is five and not the
# seven the packing table argues for: five shards is one wave, and one wave of 495s beats two
# waves of 353s. The floor — 305s, `splash.js` — is unreachable at ANY N until that suite
# becomes divisible, so the distance between 495 and 305 is the honest remaining prize and it
# is not large enough to be worth a second wave.
#
# `concurrency:` ABOVE IS PART OF THE SAME FINDING rather than housekeeping. Two live runs of
# this workflow compete for the same small pool and make each other slow, which is exactly
# what was measured.
#
# WHAT IT COSTS. Setup is the only thing duplicated — 24s per job, measured on the serial run
# — so five jobs bill about 1.6 extra runner-minutes against the serial 30. macOS minutes are
# billed at 10x either way.
#
# THE WALL CLOCK IS NOT PROMISED HERE, and that is deliberate: it is a fact about the packing,
# the runner AND what else is queued, all three of which move. It is measured against a run id
# at the bottom of this header, and `--plan` prints the packing's own expectation on demand.
#
# WHAT IT WOULD COST IN CORRECTNESS, WHICH IS THE PART THAT IS NOT ARITHMETIC. `run.js`'s
# evidence gate — every discovered suite ran, none skipped, every suite's observed count against the
# count its own source declares — was a whole-run fact while the run was one process. Split
# across N jobs it becomes N partial facts plus a job that has to add them up, and the sentence
# at the top of this file ("HOW THIS CANNOT REPORT A GREEN RUN IT DID NOT EARN") is only true
# again once that adding-up job exists. A matrix that reports five greens and no total is a
# weaker gate than one serial red.
#
# THAT ADDING-UP JOB NOW EXISTS, and it is the job below called `coverage`. It is written where
# this paragraph asked for it: in `run.js`, as the SAME gate the serial run has always applied,
# with three callers instead of one. Each shard writes a receipt per suite — the suite, its
# exit code, its ledger records, its wall clock, its shard and the COMMIT — and `coverage`
# refuses unless the union of receipts equals the inventory discovered from disk, every receipt
# carries the same commit and it is this checkout's commit, no suite is receipted twice, and
# the evidence gate passes over the aggregate. A suite whose shard never started has NO RECEIPT,
# which is a named failure rather than an absence nobody can see.
#
# `coverage` is therefore the job to read and the job to mark required, never a shard — and the
# shards say so themselves: a shard's own success line ends "Whether the DIRECTORY passed is the
# coverage job's sentence, not this one's." Shard job names are not stable across a change of
# shard count, which is the second reason to require `coverage` instead.
#
# RUN FROM A CLONE ON 2026-09-04, AND IT FOUND A FLAKE BEFORE A RUNNER DID. Every step below
# was run verbatim inside a real `git clone` of `fc56c20`, in a directory holding nothing but
# that clone and under a throwaway `$HOME` — so `npm ci` fetched WebKit into an empty cache
# the way a fresh runner image does, rather than finding one already there. Result: 20 suites
# ran, 400 checks, `realbytes.js` took the skip named on the command line below, exit 0.
# `docs/verification/workflows-on-a-clone-2026-09-04/raw/ui-suite.txt`.
#
# But the first attempt was RED, on `splash.js` check 23, and the check and the splash were
# byte-identical between the two runs. Five runs on a loaded machine gave three passes and
# two failures, with the dark reading the same byte both times and the light reading not the
# same as itself — a moving sample, not a theme leak. `splash.js` had classified the strap's
# edge as an element that holds still while sampling a fixed 30%-70% band of a bar whose fill
# is inside it. It is reclassified, with the arithmetic, at the `MOVING` list in that file.
#
# THE POINT FOR WHOEVER WATCHES THE FIRST PUBLIC RUN, written before there was one and borne
# out by it: a GitHub runner is a shared VM and this suite has been shown to be load-sensitive.
# What the run added is that LOAD was not the whole story — the runner is also several times
# slower, and the failures were not flakes but assertions that had folded the harness's own
# latency into the product's clock. A timing-shaped red here is reproduced before it is
# believed and reproduced again before it is dismissed, and `splash.js` now ships the knob for
# the first half of that: `RICHOS_SPLASH_LAG_MS=2000 node splash.js` makes a fast machine
# behave like that runner.

on:
  push:
    paths:
      # Every input the suites actually read. This is the one typed list in the file and it
      # is unavoidable — a path filter is YAML, there is nowhere to derive it from. It is
      # wider than richos/app/ui because docs-claims.js joins richos/app/README.md and richos/app/STREAMING.md to
      # the Rust tree they describe, and scale.js and steering.js read constants out of
      # richos/app/src-tauri/src. A miss here costs a run that should have happened, so it errs wide.
      #
      # THE LAST TWO ARE NOT richos/app/ AT ALL, and that is deliberate. `vouch-template.js` joins the
      # message the pull-request trust gate sends a stranger — a heredoc inside
      # `vouch-pr.yml` — to the evidence file that claims to record it. A filter that stopped at
      # `richos/app/` would leave the one suite that watches those two files unrun on every commit that
      # touches either of them, which is the whole defect it was written to end.
      - "richos/app/ui/**"
      - "richos/app/README.md"
      - "richos/app/STREAMING.md"
      - "richos/app/crates/**"
      - "richos/app/src-tauri/src/**"
      - ".github/workflows/ui-suite-ci.yml"
      - ".github/workflows/vouch-pr.yml"
      - "docs/verification/pr-trust-gate-2026-09-05/**"
  pull_request:
    paths:
      - "richos/app/ui/**"
      - "richos/app/README.md"
      - "richos/app/STREAMING.md"
      - "richos/app/crates/**"
      - "richos/app/src-tauri/src/**"
      - ".github/workflows/ui-suite-ci.yml"
      - ".github/workflows/vouch-pr.yml"
      - "docs/verification/pr-trust-gate-2026-09-05/**"
  # So the gate can be demanded on a SHA without touching the tree — the first green run has
  # to be attributable to a commit somebody names.
  workflow_dispatch:

permissions:
  contents: read

# ONE LIVE RUN PER REF. Measured rather than tidied: run 34448209503 took 902s while sharing
# the macOS pool with a SECOND ui-suite-ci run and packaging-ci, and three of its seven shards
# spent their first four to nine minutes queued rather than running. A workflow whose shards
# compete with its own superseded runs is slow for a reason nobody can see in its own log.
#
# Grouped by REF, so branches never stop each other — only a push that supersedes an earlier
# push of the SAME branch does, which is the case where the older answer had already stopped
# being the one anybody wanted.
concurrency:
  group: ui-suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------
  # THE SHARDS. Twelve minutes of nothing happening is what this matrix is for.
  #
  # `run.js --shard=i/N` packs the SAME inventory it has always discovered from disk —
  # longest-first, deterministic — and runs one slice of it. Nothing here names a suite, so a
  # suite added to `richos/app/ui/tests/` joins a shard on the commit that adds it, exactly as it
  # already joined the serial run.
  #
  # `fail-fast: false` ON PURPOSE. The default cancels the siblings the moment one shard goes
  # red, which would leave `coverage` reconciling a set full of holes and reporting "these
  # suites never ran" about suites that were killed rather than broken. A red run must still
  # say what everything else did.
  # ---------------------------------------------------------------------------------------
  shards:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Five, and the number is argued from a measured run in the header above rather than
        # from the packing table — which argues for seven and is answering a question the
        # macOS runner pool overrules. Five shards start at once; a sixth and seventh queue
        # behind them and turn one wave into two. `node run.js --plan=5` prints this packing.
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: richos/app/ui/tests
    env:
      # THE POINT OF THE WHOLE EXERCISE, asserted rather than assumed. Empty is falsy, so
      # `loadPlaywright()` skips the override and resolves `playwright` from this directory's
      # own node_modules. If the self-contained install is ever not self-contained again,
      # this job fails instead of quietly borrowing something.
      RICHOS_PLAYWRIGHT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # macos-latest ships Node, so there is no setup action here and no third-party action
      # in the chain — the same reasoning app-spine-ci.yml gives for having no rustup step.
      # Playwright 1.61 needs >= 18; print it so a runner image bump that breaks that is
      # legible in the log rather than as a stack trace.
      - name: Toolchain
        run: |
          node --version
          npm --version

      # `npm ci`, not `npm install`: it refuses to resolve anything the committed lockfile
      # does not already name. Its postinstall (`playwright install webkit`) is what fetches
      # the engine — Playwright itself ships no postinstall, which is exactly why this
      # harness spent its first six runs pointed at another repository's node_modules.
      - name: Install
        run: npm ci

      # NUSHELL, for `vouch-template.js` and for nothing else in this directory.
      #
      # That suite renders the pull-request gate's message through vouch's OWN `template
      # render`, which is a Nushell script, and refuses to fake it — a re-implementation of
      # `format pattern` that diverged would be a check staying green while the real job
      # errored. So the interpreter is a hard dependency of the run, and a missing one is a red
      # check naming this line rather than a skip.
      #
      # DELIBERATELY UNPINNED, which is the opposite of every other rule in this directory. The
      # gate itself is a composite action whose first step installs Nushell through
      # `hustcer/setup-nu` at `version: "*"`, so in production the code is pinned and the
      # interpreter is whatever shipped that morning. Pinning it here would make this check
      # greener than the thing it checks, and the time bomb `vouch-pr.yml`'s header names — a
      # deprecated builtin due for removal — is exactly the kind of break that should surface
      # here first. `brew` rather than a third-party action for the same reason
      # app-spine-ci.yml has no rustup step: one less thing in the supply chain.
      #
      # `HOMEBREW_NO_AUTO_UPDATE=1` because a full `brew update` costs more than the install.
      - name: Nushell, for the one suite that needs a real interpreter
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install nushell
          nu --version

      # A bootstrap failure and a product failure must not look alike in the log. This opens
      # WebKit and prints its version before any suite runs, so "the browser never installed"
      # is a red step of its own rather than twelve confusing suite failures.
      - name: Prove WebKit is really here, before blaming any suite
        run: |
          node -e "
            const { webkit } = require('playwright');
            webkit.launch().then(async (b) => {
              console.log('WebKit ' + b.version() + ' launched from this checkout\'s own node_modules');
              await b.close();
            }).catch((e) => { console.error(e.message); process.exit(1); });
          "

      # The gate, on this shard's slice. NO suite is allowed to skip: `--allow-skip=realbytes.js`
      # was removed on 2026-09-04 after run 33872963879 measured realbytes.js running here in
      # 2m16s. A skip, no checks, or fewer checks than its source declares, by any suite, fails
      # the shard — and separately fails `coverage`, which sees the same records in the receipt.
      - name: This shard's browser suites, under WebKit, with their counts
        run: npm test -- --shard=${{ matrix.shard }}/5 --receipts=receipts

      # THE RECEIPTS UPLOAD EVEN WHEN THE SHARD IS RED, which is the whole point of `if:
      # always()` here. `coverage` has to be able to tell "this suite ran and failed" from
      # "this suite never ran", and those are the same absence if a failing shard takes its
      # evidence with it.
      - name: This shard's receipts, red or green
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-receipts-${{ matrix.shard }}
          path: richos/app/ui/tests/receipts/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------
  # COVERAGE — the only job here that makes a claim about the DIRECTORY.
  #
  # Twelve green ticks are twelve statements. This is the one that says "every suite in
  # richos/app/ui/tests ran, at this commit, and here is what each one checked" — the sentence the
  # header at the top of this file promised and that a matrix, on its own, cannot make.
  #
  # `if: always()` because a red shard is exactly when the full picture is worth having, and
  # `needs: shards` so it runs after all five whatever they did.
  # ---------------------------------------------------------------------------------------
  coverage:
    needs: shards
    if: always()
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: richos/app/ui/tests
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # NO `npm ci` HERE, DELIBERATELY. This job opens no browser and runs no suite; it reads
      # receipts and reconciles them against the inventory it discovers from disk. Installing
      # WebKit to do that would be four minutes spent making the job look like the others.
      - name: Toolchain
        run: node --version

      # NO `merge-multiple: true`, WHICH IS THE ONE PLACE THIS DEPARTS FROM
      # engine-self-verify.yml's otherwise identical step — and the departure is the point.
      # Merging flattens every shard's files into one directory, so if two shards both
      # reported the same suite the second would silently OVERWRITE the first and the
      # duplicate would be undetectable. `coverage` refuses a suite receipted twice, and it
      # can only do that if both copies survive the download. Each artifact therefore lands
      # in its own subdirectory and `run.js` walks the tree.
      - name: Every shard's receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ui-receipts-*
          path: richos/app/ui/tests/receipts

      # The reconciliation. Refuses unless the union of receipts EQUALS the discovered
      # inventory, every receipt carries this checkout's commit, no suite is receipted twice,
      # and the evidence gate passes over the aggregate.
      - name: Every suite accounted for, by name, at one commit
        run: node run.js --coverage=receipts
