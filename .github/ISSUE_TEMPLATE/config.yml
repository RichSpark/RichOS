# Blank issues stay ON. The forms beside this file exist to make a good report
# easy, not to make a report mandatory — a stranger who found a typo in a
# document should not have to fill in a form about their operating system, and
# friction at that moment costs more than a tidy issue tracker is worth.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability — do not open an issue
    url: https://github.com/RichSpark/RichOS/security/policy
    about: >-
      A vulnerability goes through a private route, never a public issue. The
      security policy has both routes and says what to expect back.
  - name: Before you write code — pull requests need approval first
    url: https://github.com/RichSpark/RichOS/blob/main/.github/CONTRIBUTING.md
    about: >-
      Issues are open to everyone; pull requests are not. An unapproved pull
      request is closed automatically within about a minute, and an issue is the
      route to being approved. The contribution guide has the four steps, what
      the AGPL means for you, and what lands easily.
