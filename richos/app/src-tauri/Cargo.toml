[package]
name = "richos-tauri"
version = "1.2.3-nightly.20261024.72"
edition = "2021"
description = "RichOS desktop shell (Tauri) — a thin CEO-facing surface over the richos-core runtime spine."
license = "AGPL-3.0-only"

# DETACHED from the parent workspace: the empty [workspace] table keeps the heavy
# Tauri/webview dependency tree out of `cargo test -p richos-core`. richos-core is a
# path dependency below, so the shell always builds against the same spine.
[workspace]

# THE PRODUCTION CONTEXT, ON BY DEFAULT — THIS IS NOT COSMETIC.
#
# `tauri::generate_context!()` expands into one of two different programs, and which one
# it expands into is decided by a single feature on the `tauri` crate:
# `tauri-macros-2.6.3/src/context.rs:155` sets `dev: cfg!(not(feature = "custom-protocol"))`.
#
# With `dev` true, `tauri-codegen-2.6.3/src/context.rs:439-445` emits
#
#     context.with_config_parent("<CARGO_MANIFEST_DIR>");
#
# as a STRING LITERAL in generated code. `--remap-path-prefix`, which package-app.sh
# exports and which removes the other 656 occurrences of the builder's home directory,
# cannot touch it: that flag rewrites the compiler's own path metadata, not program data a
# macro already produced. MEASURED at 9a7799e — a release build with the full remap in
# force still carried exactly one host path, and it was this one.
#
# The literal is the visible half. The larger half is that a `dev` binary is not the
# shipping configuration at all: `tauri-2.11.5/src/app.rs:348-360` falls back to READING
# FRONTEND FILES OFF DISK from that same path when an embedded asset is missing, and
# `manager/mod.rs:369-380` serves `devCsp` instead of `csp`. On a stranger's machine that
# path does not exist.
#
# `cargo tauri build` was never affected, because the CLI pushes the feature itself
# (`tauri-cli-2.11.4/src/interface/rust.rs:485`). A plain `cargo build --release` was —
# and this repository tells people to run exactly that
# (`app/scripts/frontend-payload.test.sh:159`). Declaring it as a DEFAULT feature makes
# every invocation produce the same program, which is the whole point of environment
# parity: two build paths that disagree is a defect waiting for the one day it matters.
#
# `cargo tauri dev` is unaffected and still gets a dev build: the CLI's dev path filters
# default features that enable `tauri/custom-protocol` and passes `--no-default-features`
# (`rust.rs:435-451`). A deliberate dev build by hand is `--no-default-features`.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs derives the required icon set from tauri.conf.json's own bundle.icon array
# rather than hand-typing filenames. serde_json is already in this crate's runtime
# dependencies and in tauri-build's own tree, so this adds no new download.
serde_json = "1"

[dependencies]
notify = "8.2"
# DICTATION'S BAR AND MENU BAR ITEM (dictation plan rev 2, slice 3, Frank's minor 4): `tray-icon` for
# the menu bar item, `macos-private-api` for the bar's and the flight's transparent windows, which
# `tauri-build` checks against `"macOSPrivateApi": true` under `app` in tauri.conf.json. Both
# switch on code inside packages already in Cargo.lock (tray-icon 0.24.2, muda 0.19.3); the
# Cargo.lock diff of this change adds no [[package]].
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
richos-core = { path = "../crates/richos-core" }
# EVERY WINDOW COMMAND'S BODY RUNS OFF TAURI'S ASYNC WORKERS (`crates/richos-command`): the
# `#[richos_command::command]` attribute every command in this shell carries. A proc-macro
# whose three dependencies are already in this Cargo.lock, so it adds no downloaded package.
richos-command = { path = "../crates/richos-command" }
# Owner-only publication; never invokes the updater plugin's privileged macOS installer.
richos-user-update = { path = "../crates/richos-user-update" }
# RichDoctor's bundled install (src/richdoctor_install.rs): its installer only. Pure Rust over
# crates already in this lockfile (plist, flate2, tar, sha2).
richdoctor-core = { path = "../crates/richdoctor-core" }
# Voice mode: native audio (cpal) + local whisper.cpp + macOS `say`. Kept OUT of the
# richos-core workspace so `cargo test -p richos-core` never builds an audio stack.
richos-voice = { path = "../crates/richos-voice" }
# THE UPDATE PATH (src/updates.rs). Its minisign verification — `minisign_verify` inside
# `Update::download` — is the only thing standing between a manifest URL and code running
# on the CEO's Mac, so it is a pinned floor rather than a bare "2".
tauri-plugin-updater = "2.11.0"
# `time` for the launch check's delay only. Already in the tree beneath `tauri` (which
# builds on it), so no new download: `cargo tree -i tokio` in this crate shows it arriving
# via tauri 2.x. Named here because a file that calls `tokio::time::sleep` while depending
# on it only transitively breaks the day tauri changes runtimes.
# `rt` joins `time` for `examples/provision_model.rs`, which drives the shipped async fetch loop
# on a current-thread runtime so a real download can be proven without launching the app.
# `tauri` already builds on tokio's runtime, so features unify and the Cargo.lock diff for this
# line is empty.
# `net`, `io-util` and `sync` join them for the phone channel's listener (src/phone/): a
# TCP accept loop, the TLS acceptor's reads and writes, and the broadcast the event stream
# is fed from. All three are already enabled in this graph beneath tauri — `mio`, `socket2`
# and `libc` are in tokio's lock entry today — so naming them adds no package. `macros` is
# deliberately NOT named: it is the one tokio feature that would pull a new `[[package]]`
# (`tokio-macros` is absent from the lock), so the tests in `src/phone/` build their own
# current-thread runtime rather than buy a package for an attribute.
# `rt-multi-thread` for `tokio::task::block_in_place`, which `#[richos_command::command]` emits
# around every command body. Tauri's own runtime is the multi-threaded one
# (`tauri-2.11.5/src/async_runtime.rs:223`, `TokioRuntime::new()`), so the feature is already on
# in this graph; it is named because the shell's own code now depends on it.
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "net", "io-util", "sync"] }
# THE SPEECH-MODEL DOWNLOAD (src/voice_provision.rs).
#
# NO NEW CRATE, AND THE FEATURE LIST IS WHY IT IS SPELLED OUT RATHER THAN LEFT TO A DEFAULT.
# `tauri-plugin-updater` already depends on `reqwest 0.13` with `default-features = false` and
# exactly `["json", "stream"]`, and its own default feature set adds `reqwest/rustls-no-provider`
# and `reqwest/system-proxy`. Cargo unifies features across the graph, so every feature named
# below is ALREADY enabled in this binary today. Naming a feature the plugin does not enable
# (`http2`, `rustls`) would pull `h2` or `aws-lc-rs` — and `aws-lc-rs` needs a C toolchain the
# build does not have — which is exactly the kind of inherited default the CEO's standing rule
# refuses. The proof is the Cargo.lock diff for this commit: it adds no [[package]] entry.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
# `StreamExt::next` over the response byte stream, and — since the phone channel — `select` to
# race one `accept()` against one shutdown signal. `futures_util::future::select` is used rather
# than `tokio::select!` for one reason: the macro lives behind `tokio/macros`, which would pull
# `tokio-macros` as a NEW `[[package]]`, and an attribute is not worth a package. Already in the
# lock either way.
futures-util = { version = "0.3", default-features = false }
# `Bytes` for a response body. It arrives beneath hyper and tokio already; named here because
# `src/phone/listen.rs` constructs it directly rather than only handling one.
bytes = "1"
# THE TLS CRYPTO PROVIDER, INSTALLED BY US RATHER THAN HOPED FOR.
#
# `reqwest/rustls-no-provider` means reqwest picks no cipher implementation: a process-level
# provider must be installed before a client is built, or the build fails. Today the only code
# in this binary that installs one is `tauri-plugin-updater-2.11.0/src/updater.rs:492-494`, and
# it does so lazily, inside the update check. So a model download that happens before the app has
# ever checked for an update would find no provider at all — a dependency on the ORDER two
# unrelated features run in, which is a defect waiting for the one first run that hits it.
# `voice_provision.rs` therefore installs the same `ring` provider itself, idempotently, before
# building its client. Already in the lock at 0.23.43 beneath the updater plugin.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# THE PHONE CHANNEL'S HTTPS LISTENER (src/phone/). RichOS's first inbound socket.
#
# THE ASSUMPTION THIS BLOCK WAS SUPPOSED TO CONFIRM, AND DID NOT.
#
# The phone-client plan's §3.5 assumption 2 reads: *"`hyper`'s `server` feature adds no
# `[[package]]` line. Every crate is in the lock today (§2.3)."* Measured here rather than
# quoted: the five crates named in §2.3 are indeed all in the lock already — hyper 1.11.1,
# hyper-util 0.1.20, http-body-util 0.1.5, rustls 0.23.43, tokio-rustls 0.26.4 — and
# enabling `hyper/server` on top of them adds EXACTLY ONE package:
#
#     + httpdate 1.0.3    (checksum df3b4640…49a9)
#
# hyper's server pulls it to format the `Date:` response header, which is a header an HTTP
# server is required to send. So the assumption is false by one crate, and the plan's own
# answer to that case — *"that is a dependency review and half a day"* — is discharged here
# rather than absorbed, because this file's own standing rule is that an inherited default
# is argued for.
#
# THE REVIEW, on the copy in the local registry:
#   - 580 lines of Rust in two files (`src/lib.rs` 160, `src/date.rs` 420).
#   - `#![forbid(unsafe_code)]` at `src/lib.rs:19`. There is no other occurrence of the word.
#   - ZERO runtime dependencies. Its only dev-dependency is `criterion`, which a consumer
#     never builds.
#   - No build script, no proc macro, no network, no filesystem, no `std::process`.
#   - What it does is arithmetic on a `u64` of seconds: format and parse the three date forms
#     RFC 7231 §7.1.1.1 defines.
#   - MIT OR Apache-2.0, `github.com/pyfisch/httpdate`, and it already ships inside every
#     binary that has ever run an HTTP server in Rust.
# A date formatter with no dependencies and no unsafe code is about the smallest thing a new
# `[[package]]` line can be, and the alternative is writing the same 580 lines ourselves.
# Accepted, with the count named so the next reader does not have to re-derive it.
#
# EVERYTHING ELSE BELOW ADDS NO PACKAGE, and the Cargo.lock diff for this commit is the
# proof: the only `[[package]]` it introduces is the one above.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
# `TokioIo` only — the `tokio` feature and nothing else. `server-graceful` and `service` are
# deliberately not enabled: shutdown here is a channel the listener selects on, which is
# already how the rest of this app stops things it owns.
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# `Full<Bytes>` for a fixed response, `Limited` to refuse an oversized request body BEFORE
# reading it, and `channel` for the event stream's body — an SSE response is a body that stays
# open and is written to from a task, which is exactly what `http_body_util::Channel` is. That
# feature's only dependency is `dep:tokio`, which is already here, so it adds no package.
http-body-util = { version = "0.1", features = ["channel"] }
# THE TLS ACCEPTOR. `ring` rather than `aws-lc-rs` for the reason `rustls` above already
# gives: `aws-lc-rs` needs a C toolchain this build does not have. Same provider as the one
# `voice_provision.rs` installs, so there is one crypto provider in this process, not two.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# THE CRYPTO THE PHONE CHANNEL ITSELF NEEDS, and it is all in one crate that is already in
# the lock beneath rustls: ECDSA P-256 verification (the phone's request signatures) and
# signing (the VAPID JWT, RFC 8292), ECDH P-256 (RFC 8291 §3.3), HKDF-SHA256, AES-128-GCM,
# SHA-256 and a CSPRNG. No second implementation of any of them enters this binary.
ring = "0.17"
# base64url, which is the only encoding RFC 8291 and RFC 8292 use. Already a dev-dependency
# of this crate and already in the lock at 0.22.1.
base64 = "0.22"
# THE OUTPUT FILES (src/output_files.rs): `O_NOFOLLOW` and `ELOOP` for the reads that must
# never go through a link (Output side panel PRD §5.2 step 5). Already in the lock at 0.2.189
# beneath tokio, tao and ring (`cargo tree -i libc`); naming it adds no package.
libc = "0.2"

# THE OUTPUT PANEL'S *SAVE A COPY…* (src/output_files.rs `output_save_copy`, Output side panel
# PRD §5.4 and slice S6 §12.6): the system save sheet. Tauri's own first-party plugin, run from
# Rust only; NONE of its commands is granted in capabilities/default.json (the updater's
# posture), which `output_files_the_dialog_plugin_is_never_granted_to_the_webview` reads and
# enforces. Pinned to the version in the local registry and resolved in Cargo.lock beside its
# one new sibling, tauri-plugin-fs (its `FilePath` type) and rfd (the native sheet).
tauri-plugin-dialog = "2.7.1"

# THE OUTPUT FILES' APP LIST (src/output_files.rs, Output side panel PRD §5.4): Launch
# Services' default application and *Open with…* candidates for a file, and each bundle's
# name. The PRD's `unverified:` is settled by `cargo tree -i core-foundation@0.10.1`: Tauri
# already pulls 0.10.1 on macOS (beneath tao, security-framework, core-graphics and
# rustls-platform-verifier), so naming it adds no package (the Cargo.lock diff is two
# dependency lines and no `[[package]]`) and the degraded mode §5.4 declares is not needed.
# The two Launch Services functions are declared in output_files.rs against the CoreServices
# framework.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# DICTATION IN ANY APP (src/dictation/, dictation plan rev 2 section 1): NSEvent's system-defined
# data word for the Apple top row, NSPasteboard for the paste and its restore, NSProcessInfo's
# activity against App Nap, NSRunningApplication for Finder's desktop. Reached through objc2's
# runtime and `msg_send!` only, no framework crate and no feature: objc2 0.6.4 is already in the
# lock beneath tauri, tao and wry (`cargo tree -i objc2`), so this is a direct edge onto an
# existing node and the Cargo.lock diff adds no [[package]].
objc2 = "0.6"
# THE MICROPHONE PROMPT (src/dictation_app.rs, dictation plan slice 2, section 2 row 7):
# `AVCaptureDevice requestAccessForMediaType:completionHandler:` takes an Objective-C block.
# block2 0.6.2 is already in the lock beneath objc2's users (the plan's measured fact table), so
# this is a direct edge onto an existing node and the Cargo.lock diff adds no [[package]].
block2 = "0.6"

# THE REAL DOWNLOAD, WITHOUT A WINDOW. Compiles src/voice_provision.rs by path, exactly as
# examples/window_placement.rs compiles src/window_geometry.rs, and substitutes only the observer.
# Declared here rather than left to auto-discovery so every example this crate ships is visible in
# one list.
[[example]]
name = "provision_model"
path = "examples/provision_model.rs"

# THE OUTPUT FILE COMMANDS, WITHOUT A PANEL. Compiles src/output_files.rs by path and calls what
# `output_open` and `output_reveal` call, for the test VM's real-app check (Output side panel
# PRD §12.3) until the panel exists. `test = true` so its own test runs
# (scripts/output-files-probe.test.sh); that test opens nothing.
[[example]]
name = "output_files_probe"
path = "examples/output_files_probe.rs"
test = true

# THE DICTATION WALK'S TWO HELPERS (dictation plan section 9, slice 1), run in the test guest only:
# `post_key` posts the Apple top row's brightness-down as the system-defined event a physical
# Apple keyboard sends, which System Events cannot post; `key_probe` is a listen-only tap standing
# in for open-wispr's passive observer, so the walk can prove the tool swallows the key.
# `test = true`: each carries a test that runs with `cargo test --examples` and opens nothing.
[[example]]
name = "post_key"
path = "examples/post_key.rs"
test = true

[[example]]
name = "key_probe"
path = "examples/key_probe.rs"
test = true

# THE RIGHT-CLICK MENU (src/webview_menu.rs): this Mac's own WebKit, in a window never put on
# screen, sent right-clicks straight to the view, with a recorder in place of the call that would
# draw the menu. Run by scripts/context-menu-probe.test.sh; it has its own `main` and needs the
# main thread, so it is not a libtest target.
[[example]]
name = "context_menu_probe"
path = "examples/context_menu_probe.rs"

[dev-dependencies]
# `tauri::test`'s mock runtime, for `src/command_rule_tests.rs`: commands dispatched through
# Tauri's real IPC path in a unit test. The `test` feature is `test = []` in tauri 2.11.5's
# manifest, so it adds no package; as a dev-dependency feature it is on in test builds only.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "test"] }
# `examples/verify_update_signature.rs` — the pre-publication check that a produced
# `.app.tar.gz` and its `.sig` actually agree under the key `tauri.conf.json` ships.
# DELIBERATELY THE SAME CRATE the updater verifies with (it arrives beneath
# tauri-plugin-updater), because a second Ed25519 implementation is a thing that can
# disagree with the one that matters.
minisign-verify = "0.2"
base64 = "0.22"
# `examples/verify_update_manifest.rs` — the same reasoning one level up. It compares an
# offered version against an installed one with the ORDERING the updater uses
# (`updater.rs:575`, `release.version > self.current_version`), and `RemoteRelease.version`
# is already a `semver::Version`. Comparing those two as strings is the defect this avoids:
# "0.1.10" sorts below "0.1.9" and the release nobody is offered looks perfect.
semver = "1"

# Check ignored outcomes and asynchronous work at the lint entry point.
# Timeout refusal regression: a0b51998. These warn on related Rust mistakes;
# shell timeout control flow is covered by the project rule, not by Clippy.
[lints.rust]
unused_must_use = "warn"

[lints.clippy]
let_underscore_future = "warn"
let_underscore_must_use = "warn"
await_holding_lock = "warn"
