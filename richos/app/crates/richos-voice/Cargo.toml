[package]
name = "richos-voice"
version = "0.1.0"
edition = "2021"
description = "RichOS voice mode: mic capture -> VAD/barge-in -> local whisper STT -> the spine -> sentence-pipelined TTS out. A MODE of the one persistent conversation, never a room."
license = "AGPL-3.0-only"
# Turns RICHOS_VOICE_LIVE_AUDIO (run time) into `cfg(live_audio)` (compile time) so the four
# device-opening tests report `ignored` instead of `ok` when nobody has opted in. It emits no
# code and links nothing; `build.rs` states the whole reasoning.
build = "build.rs"

# Native audio lives HERE, not in richos-core: `cargo test -p richos-core` must stay fast
# and native-dependency-free (app/README.md "Layout"). cpal is the only third-party native
# dependency; WAV I/O, resampling, VAD, the barge-in monitor, the sentence chunker and the
# state machine are all hand-rolled so they are pure, unit-testable functions.
[dependencies]
cpal = "0.17"
serde_json = "1"
# SHA-256 for the whisper toolchain check (`toolchain.rs`): the identity of the binary, of every
# ggml backend it loads, and of the weights. Pure Rust, no native dependency, and already in this
# workspace's lock for richos-core's pinned engine asset — so no new supply-chain surface. Chosen
# over shelling out to `shasum -a 256` for the reason richos-core's manifest already gives: an
# integrity check whose answer depends on parsing a subprocess's stdout is the exact shape of
# "exit 0 while doing the wrong thing".
sha2 = "0.10"
# `hardware.rs` asks the machine what it is: `sysctlbyname` for hw.memsize / hw.pagesize /
# hw.perflevel*.logicalcpu / kern.memorystatus_vm_pressure_level, and `host_statistics64` for the
# four page buckets `vm_stat` reports. ALREADY IN THIS WORKSPACE'S LOCK at 0.2.189 (cpal pulls it
# transitively), so this is a direct edge onto an existing node rather than new supply-chain
# surface — the same argument this manifest already makes for sha2. Chosen over shelling out to
# `sysctl -n` for the same reason toolchain.rs hashes in-process: a machine fact parsed out of a
# subprocess's stdout fails as a plausible number rather than as an error.
libc = "0.2"
# RICH'S VOICE: Kyutai Pocket TTS with the Peter Yearsley preset (`pocket.rs`, CEO 2026-10-14).
# The engine is lifted from Buzz's `crates/buzz-voice/src/pocket_april.rs` (block/buzz,
# Apache-2.0), which runs the KevinAHM/pocket-tts-onnx INT8 graphs through ONNX Runtime with
# exactly these three crates and these versions. `ort` keeps its default `download-binaries`, so
# ONNX Runtime is linked STATICALLY into the app binary: no dylib to ship or sign beside it and
# no Python on the user's Mac. `tokenizers` + `sentencepiece-model` are the bundle's
# SentencePiece frontend. `serde` derives the bundle.json manifest.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "download-binaries", "tls-native"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sentencepiece-model = "0.1"
serde = { version = "1", features = ["derive"] }

# The end-to-end example wires the REAL spine (stream-json stdio -> Claude). Dev-only, so
# the shipped crate stays spine-agnostic: richos-voice knows nothing about ledgers or leases.
[dev-dependencies]
richos-core = { path = "../richos-core" }

# `test = true` runs the example's own setup test with `cargo test -p richos-voice`, so a loop
# that can no longer open its conversation fails there, not at its next live run (hunt part 1
# finding 46). The setup test opens no device and starts no provider.
[[example]]
name = "voice_loop"
path = "examples/voice_loop.rs"
test = true

[[example]]
name = "device_probe"
path = "examples/device_probe.rs"

[[example]]
name = "toolchain_probe"
path = "examples/toolchain_probe.rs"

[[example]]
name = "model_resolution"
path = "examples/model_resolution.rs"

[[example]]
name = "noaudio_live"
path = "examples/noaudio_live.rs"

[[example]]
name = "aec_rig"
path = "examples/aec_rig.rs"

[[example]]
name = "aec_live"
path = "examples/aec_live.rs"

[[example]]
name = "aec_transcribe"
path = "examples/aec_transcribe.rs"

[[example]]
name = "aec_probe"
path = "examples/aec_probe.rs"

[[example]]
name = "aec_capture"
path = "examples/aec_capture.rs"

[[example]]
name = "bargein_score"
path = "examples/bargein_score.rs"

[lints]
workspace = true
