[package]
name = "richos-core"
version = "0.1.0"
edition = "2021"
description = "RichOS runtime spine: the native Claude stream-json client, durable conversation + action ledger, thread data model, and session-continuity foundation. UI-agnostic; no GUI, no relay, no npm."
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
time = { version = "0.3", features = ["parsing"] }
# SHA-256 for the pinned engine asset (`setup.rs`). Pure Rust, no native dependency and no
# TLS stack, so `cargo test -p richos-core` stays fast. Chosen over shelling out to
# `shasum -a 256` because an integrity check whose answer depends on parsing a subprocess's
# stdout is the exact shape of "exit 0 while doing the wrong thing".
sha2 = "0.10"
# Unicode canonical decomposition (NFD) for matching a bug report's private names
# (`bug_report.rs`): "é" written as one character and as "e" plus a combining accent are one
# name. Pure Rust, no native dependency. Chosen over a decomposition table kept by hand, which
# would be a second copy of Unicode's data that nobody updates.
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The crash matrix's abort points for his answers to a work job (`work_host`'s, and its one
# `work_fault`), compiled only into the `work_walk` build the VM crash matrix hands the guest. No
# product build enables it; without it every point is an empty inline function.
crash-points = []

# `test = true` runs an example's own setup test with `cargo test -p richos-core`, so an example
# that can no longer open its conversation fails there, not at its next live run (hunt part 1
# finding 46). The setup tests start no provider.
[[example]]
name = "native_roundtrip"
path = "examples/native_roundtrip.rs"
test = true

[[example]]
name = "native_failure_modes"
path = "examples/native_failure_modes.rs"



[[example]]
name = "machinery_roundtrip"
path = "examples/machinery_roundtrip.rs"
test = true

[[example]]
name = "live_events_roundtrip"
path = "examples/live_events_roundtrip.rs"
test = true

[[example]]
name = "worker_status_demo"
path = "examples/worker_status_demo.rs"


[[example]]
name = "loro_correction_demo"
path = "examples/loro_correction_demo.rs"

[[example]]
name = "launch_kinds"
path = "examples/launch_kinds.rs"

[[example]]
name = "first_run_demo"
path = "examples/first_run_demo.rs"

[[example]]
name = "provision_refusals"
path = "examples/provision_refusals.rs"

[[example]]
name = "setup_demo"
path = "examples/setup_demo.rs"

[[example]]
name = "setup_failures"
path = "examples/setup_failures.rs"

# How long the CEO's turn is held open by writing an assignment down — the measurement the
# background-work spec's §0 row 2 turns on, and the one §7.1 left as an obligation.
[[example]]
name = "assignment_receipt_timing"
path = "examples/assignment_receipt_timing.rs"

[lints]
workspace = true
