[package]
name = "richos-devtools"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Offline developer reports and source checks; no app runtime dependency"

# Like the updater and Tauri shell, build independently of the audio workspace.
[workspace]

[dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
