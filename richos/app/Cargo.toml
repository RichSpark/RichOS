# RichOS app workspace.
#
# richos-core is the native-dependency-free runtime spine; richos-voice is the voice
# mode's audio pipeline (cpal + local whisper.cpp + macOS `say`). They are separate
# members so `cargo test -p richos-core` never builds an audio stack. The Tauri shell (src-tauri/) is a
# DELIBERATELY DETACHED nested workspace (its Cargo.toml carries an empty
# [workspace] table) so the heavy webview/Tauri dependency tree never gates
# `cargo test -p richos-core`. See app/README.md for the rationale.
[workspace]
resolver = "2"
# richos-command is the Tauri shell's `#[richos_command::command]` attribute (a proc-macro with
# no native dependency), a member here so its expansion tests run without the webview tree.
members = ["crates/richos-core", "crates/richos-voice", "crates/richos-command"]

# Check ignored outcomes and asynchronous work at the lint entry point.
# Timeout refusal regression: a0b51998. These warn on related Rust mistakes;
# shell timeout control flow is covered by the project rule, not by Clippy.
[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
let_underscore_future = "warn"
let_underscore_must_use = "warn"
await_holding_lock = "warn"
